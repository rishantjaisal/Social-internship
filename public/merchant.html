<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Portal | LocalBiz</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon"><i class="fa-solid fa-store"></i></div>
        <div class="brand-text">Local<span>Biz</span></div>
      </a>
      <div class="nav-actions">
        <a href="shop.html?slug=kusum-medical" class="btn btn-outline" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> View Storefront</a>
      </div>
    </div>
  </header>

  <div class="container" style="margin-top: 40px; margin-bottom: 80px;">
    <!-- Merchant Header Card -->
    <div style="background: var(--dark); color: white; border-radius: var(--radius-lg); padding: 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; box-shadow: var(--shadow-lg);">
      <div>
        <span class="badge badge-success" style="background: #10b981; color: white;"><i class="fa-solid fa-circle"></i> Live Storefront</span>
        <h1 style="font-size: 2rem; font-weight: 900; margin-top: 8px;">Kusum Medical Store</h1>
        <p style="color: #94a3b8; font-size: 0.875rem;">Merchant Operations Portal • Control live orders & inventory</p>
      </div>

      <div>
        <button class="btn btn-primary" id="toggleHolidayBtn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">
          <i class="fa-solid fa-toggle-on" style="color: #10b981;"></i> Store Open
        </button>
      </div>
    </div>

    <!-- Quick Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 32px;">
      <div style="background: white; padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border); shadow: var(--shadow-sm);">
        <p style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Today's Sales</p>
        <h3 style="font-size: 1.75rem; font-weight: 900; color: var(--text-main); margin-top: 4px;">₹8,420</h3>
        <span style="font-size: 0.75rem; font-weight: 700; color: #16a34a;">14 Orders Delivered</span>
      </div>

      <div style="background: white; padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border); shadow: var(--shadow-sm);">
        <p style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Active Orders</p>
        <h3 style="font-size: 1.75rem; font-weight: 900; color: var(--primary); margin-top: 4px;" id="activeOrderCount">1</h3>
        <span style="font-size: 0.75rem; color: var(--text-muted);">Requires confirmation</span>
      </div>
    </div>

    <!-- Live Orders Section -->
    <div style="background: white; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-top: 32px; box-shadow: var(--shadow-sm); overflow: hidden;">
      <div style="padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-weight: 800;">Live Incoming Customer Orders</h3>
        <button class="btn btn-outline" id="refreshOrdersBtn" style="padding: 6px 12px; font-size: 0.75rem;"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
      </div>

      <div id="ordersContainer" style="display: flex; flex-direction: column;">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ordersContainer = document.getElementById('ordersContainer');
      const activeOrderCount = document.getElementById('activeOrderCount');
      const refreshOrdersBtn = document.getElementById('refreshOrdersBtn');
      const toggleHolidayBtn = document.getElementById('toggleHolidayBtn');
      let isHoliday = false;

      async function fetchMerchantOrders() {
        try {
          const response = await fetch('/api/merchant/orders');
          const data = await response.json();

          if (data.success) {
            renderOrders(data.orders);
          }
        } catch (err) {
          console.error('Error fetching merchant orders:', err);
        }
      }

      function renderOrders(orders) {
        if (!ordersContainer) return;

        const activeCount = orders.filter(o => o.status !== 'DELIVERED').length;
        if (activeOrderCount) activeOrderCount.textContent = activeCount;

        if (orders.length === 0) {
          ordersContainer.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">No orders received yet.</div>';
          return;
        }

        ordersContainer.innerHTML = orders.map(order => `
          <div style="padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <strong style="font-size: 0.875rem;">${order.id}</strong>
                <span class="badge ${order.status === 'PENDING' ? 'badge-warning' : 'badge-success'}">${order.status}</span>
              </div>
              <h4 style="font-size: 1rem; font-weight: 800; margin-top: 4px;">${order.customerName} (${order.customerPhone})</h4>
              <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">Items: ${order.items.join(', ')} • <strong>Total: ₹${order.total}</strong></p>
            </div>

            <div style="display: flex; gap: 8px;">
              ${order.status === 'PENDING' ? `
                <button class="btn btn-primary action-btn" data-id="${order.id}" data-status="ACCEPTED" style="padding: 8px 14px; font-size: 0.8rem;">
                  Accept Order
                </button>
              ` : ''}
              ${order.status === 'ACCEPTED' ? `
                <button class="btn btn-primary action-btn" data-id="${order.id}" data-status="DELIVERED" style="background: var(--secondary); padding: 8px 14px; font-size: 0.8rem;">
                  Mark Delivered
                </button>
              ` : ''}
              ${order.status === 'DELIVERED' ? `
                <span style="font-size: 0.8rem; font-weight: 800; color: #16a34a;"><i class="fa-solid fa-circle-check"></i> Completed</span>
              ` : ''}
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.action-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const status = btn.dataset.status;

            await fetch(`/api/merchant/orders/${id}/status`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status })
            });

            fetchMerchantOrders();
          });
        });
      }

      if (refreshOrdersBtn) refreshOrdersBtn.addEventListener('click', fetchMerchantOrders);
      if (toggleHolidayBtn) {
        toggleHolidayBtn.addEventListener('click', () => {
          isHoliday = !isHoliday;
          if (isHoliday) {
            toggleHolidayBtn.innerHTML = '<i class="fa-solid fa-toggle-off" style="color: #f59e0b;"></i> Holiday Mode';
            toggleHolidayBtn.style.color = '#f59e0b';
          } else {
            toggleHolidayBtn.innerHTML = '<i class="fa-solid fa-toggle-on" style="color: #10b981;"></i> Store Open';
            toggleHolidayBtn.style.color = 'white';
          }
        });
      }

      fetchMerchantOrders();
    });
  </script>
</body>
</html>
