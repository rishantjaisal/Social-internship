<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | LocalBiz</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-card {
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      max-width: 440px;
      margin: 60px auto 100px auto;
      padding: 36px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }
    .form-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .form-group input {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      outline: none;
      transition: var(--transition);
    }
    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .alert-message {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
    }
    .alert-error {
      background: #ffe4e6;
      color: #9f1239;
      border: 1px solid #fecdd3;
    }
    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <div class="brand-icon"><i class="fa-solid fa-store"></i></div>
        <div class="brand-text">Local<span>Biz</span></div>
      </a>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-primary">Create Account</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.75rem; font-weight: 900;">Welcome Back</h1>
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 4px;">Sign in to your Customer or Merchant account</p>
      </div>

      <div id="loginMessage" class="alert-message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" required placeholder="e.g. merchant@localbiz.com or customer@example.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" required placeholder="••••••••">
            <button type="button" class="toggle-pwd-btn" id="toggleLoginPasswordBtn" title="Show/Hide Password">
              <i class="fa-solid fa-eye" id="loginEyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; padding: 14px; margin-top: 8px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.8rem; color: var(--text-muted);">
        Don't have an account yet? <a href="register.html" style="color: var(--primary); font-weight: 700;">Create Account</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const loginEmail = document.getElementById('loginEmail');
      const loginPassword = document.getElementById('loginPassword');
      const toggleLoginPasswordBtn = document.getElementById('toggleLoginPasswordBtn');
      const loginEyeIcon = document.getElementById('loginEyeIcon');
      const loginMessage = document.getElementById('loginMessage');
      const loginSubmitBtn = document.getElementById('loginSubmitBtn');

      // Toggle Password Visibility Eye Button
      if (toggleLoginPasswordBtn && loginPassword && loginEyeIcon) {
        toggleLoginPasswordBtn.addEventListener('click', () => {
          const isPassword = loginPassword.type === 'password';
          loginPassword.type = isPassword ? 'text' : 'password';
          loginEyeIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });
      }

      function showMessage(msg, isSuccess = false) {
        loginMessage.textContent = msg;
        loginMessage.className = `alert-message ${isSuccess ? 'alert-success' : 'alert-error'}`;
        loginMessage.style.display = 'block';
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = loginEmail.value.trim();
        const password = loginPassword.value.trim();

        if (!email || !password) {
          showMessage('Please enter both email and password.');
          return;
        }

        loginSubmitBtn.disabled = true;
        loginSubmitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing In...';

        let userRole = 'CUSTOMER';
        let userName = email.split('@')[0];
        let authenticated = false;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          
          if (res.ok) {
            const data = await res.json();
            if (data.success && data.user) {
              authenticated = true;
              userRole = data.user.role || 'CUSTOMER';
              userName = data.user.name || userName;
            }
          }
        } catch (err) {
          console.warn('API authentication unavailable, using client session storage fallback:', err);
        }

        // Local Storage User Verification Fallback for Static Deployments (Netlify)
        if (!authenticated) {
          const registeredUsers = JSON.parse(localStorage.getItem('localbiz_registered_users') || '[]');
          const found = registeredUsers.find(u => u.email.toLowerCase() === email.toLowerCase());
          
          if (found) {
            if (found.password && found.password !== password) {
              showMessage('Incorrect password. Please try again.');
              loginSubmitBtn.disabled = false;
              loginSubmitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Account';
              return;
            }
            authenticated = true;
            userRole = found.role || 'CUSTOMER';
            userName = found.name || userName;
          } else {
            // Default smart role inference
            userRole = (email.includes('merchant') || email.includes('shop') || email.includes('kusum')) ? 'MERCHANT' : 'CUSTOMER';
            authenticated = true;
          }
        }

        // Store active session
        const sessionUser = {
          email,
          name: userName,
          role: userRole,
          loggedInAt: new Date().toISOString()
        };
        localStorage.setItem('localbiz_active_user', JSON.stringify(sessionUser));

        showMessage(`Sign in successful! Welcome back ${userName}. Redirecting...`, true);

        setTimeout(() => {
          if (userRole === 'MERCHANT') {
            window.location.href = 'merchant.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 1000);
      });
    });
  </script>
</body>
</html>
